nextcloud:
  nextcloud:
    host: nextcloud.shivpatel.xyz
    existingSecret:
      enabled: true
      secretName: nextcloud-secret
      usernameKey: nextcloud-username
      passwordKey: nextcloud-password
    # TLS terminates at Cloudflare/Traefik, so Nextcloud only sees plain HTTP.
    # Without these it emits http:// redirects and non-Secure cookies, which
    # breaks browser and mobile app login (endless spinner).
    extraEnv:
      - name: OVERWRITEPROTOCOL
        value: https
      - name: OVERWRITECLIURL
        value: https://nextcloud.shivpatel.xyz
    extraVolumes:
      - name: apache-status
        configMap:
          name: nextcloud-apache-status
    extraVolumeMounts:
      - name: apache-status
        mountPath: /etc/apache2/conf-enabled/datadog-status.conf
        subPath: datadog-status.conf
        readOnly: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  podAnnotations:
    ad.datadoghq.com/nextcloud.checks: |
      {
        "apache": {
          "init_config": {},
          "instances": [
            {
              "apache_status_url": "http://%%host%%:8081/server-status?auto",
              "service": "nextcloud-apache"
            }
          ]
        },
        "nextcloud": {
          "init_config": {},
          "instances": [
            {
              "url": "http://nextcloud.nextcloud.svc.cluster.local:8080/ocs/v2.php/apps/serverinfo/api/v1/info",
              "headers": {
                "Host": "nextcloud.shivpatel.xyz"
              },
              "username": "ENC[k8s_secret@nextcloud/nextcloud-secret/nextcloud-username]",
              "password": "ENC[k8s_secret@nextcloud/nextcloud-secret/nextcloud-password]",
              "service": "nextcloud"
            }
          ]
        }
      }
    ad.datadoghq.com/nextcloud.logs: |
      [
        {
          "source": "apache",
          "service": "nextcloud-apache"
        }
      ]
  persistence:
    enabled: true
    # using default storageclass (longhorn) for core files
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-nfs
