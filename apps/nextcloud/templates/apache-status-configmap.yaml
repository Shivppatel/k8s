apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-apache-status
data:
  datadog-status.conf: |-
    Listen 8081
    ExtendedStatus On
    <VirtualHost *:8081>
      DocumentRoot /tmp
      <Directory /tmp>
        AllowOverride None
        Require all denied
      </Directory>
      <Location /server-status>
        SetHandler server-status
        Require all granted
      </Location>
    </VirtualHost>
