apiVersion: v1
kind: ResourceQuota
metadata:
  name: github-actions-personal-runners
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    # Up to two runner pods per scale set: six plain runners (500m/1Gi requests,
    # 2 CPU/4Gi limits each) and two Docker-in-Docker pods (twice that), plus
    # headroom for one more Docker-in-Docker pod while finished runners
    # terminate. Listeners run in the controller namespace.
    pods: "10"
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "24"
    limits.memory: 48Gi
