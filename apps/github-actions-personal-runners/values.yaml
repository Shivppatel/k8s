# Shivppatel/helm
helm:
  githubConfigUrl: "https://github.com/Shivppatel/helm"
  githubConfigSecret: github-actions-personal-runner-auth
  runnerScaleSetName: shivppatel-helm
  scaleSetLabels:
    - homelab
    - linux
  minRunners: 0
  maxRunners: 2
  controllerServiceAccount: *controllerServiceAccount
  listenerTemplate: *listenerTemplate
  template: *runnerTemplate

network:
  kubernetesServiceAddress: "10.96.0.1/32"
  controlPlaneApiEndpoints:
    - "192.168.20.9/32"
    - "192.168.20.10/32"
    - "192.168.20.11/32"
    - "192.168.20.12/32"
  # Scale sets whose runner pods may also reach public hosts on TCP 80, like
  # shivws-docker-runners. Every other pod is limited to TCP 443.
  httpEgressScaleSets:
    - shivppatel-sherlock
