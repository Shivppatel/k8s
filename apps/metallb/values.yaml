metallb:
  speaker:
    # All nodes are control-plane nodes that also host workloads.
    # Allow them to advertise the internal ingress VIP despite kubeadm's label.
    ignoreExcludeLB: true
  controller:
    enabled: true
    image:
      pullPolicy: Always
  # rbac:
  #   create: false
  prometheus:
    serviceAccount: "kube-prometheus-stack-prometheus"
    namespace: "observability"
    serviceMonitor:
      enabled: true
  frr-k8s:
    prometheus:
      serviceMonitor:
        enabled: true
