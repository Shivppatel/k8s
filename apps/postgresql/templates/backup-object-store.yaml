# Barman Cloud plugin object store for the shared cluster: continuous WAL
# archive plus base backups in MinIO bucket postgresql-backups (tf/minio).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgresql-backups
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Recoverability window; older base backups and WAL are pruned.
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://postgresql-backups/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: postgresql-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgresql-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
