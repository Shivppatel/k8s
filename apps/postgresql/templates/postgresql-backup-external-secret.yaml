# MinIO credentials for the Barman Cloud ObjectStore. Terraform (tf/minio)
# owns the bucket and user; the secret key lives in Vault KV v2 at
# secret/postgresql/backup-s3 (fields: accesskey, secretkey).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgresql-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: secret/data/postgresql/backup-s3
        property: accesskey
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: secret/data/postgresql/backup-s3
        property: secretkey
