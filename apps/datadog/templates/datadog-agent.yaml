kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
spec:
  global:
    clusterName: "homelab"
    site: "us5.datadoghq.com"
    clusterAgentTokenSecret:
      secretName: "datadog-secret"
      keyName: "cluster-agent-token"
    kubelet:
      tlsVerify: false
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
    # Enable secrets backend to read from Kubernetes secrets
    secretBackend:
      command: "/readsecret_multiple_providers.sh"
      enableGlobalPermissions: true
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    helmCheck:
      enabled: false
    logCollection:
      enabled: true
      containerCollectAll: false
    otelCollector:
      enabled: false
      ports:
        - containerPort: 4317
          hostPort: 4317
          name: "otel-grpc"
          protocol: TCP
        - containerPort: 4318
          hostPort: 4318
          name: "otel-http"
          protocol: TCP
  override:
    nodeAgent:
      image:
        name: "ghcr.io/shivppatel/datadog-agent-emqx:7.73.0-jmx-emqx-1.1.0"
        jmxEnabled: true
      extraConfd:
        configDataMap:
          etcd.yaml: |-
            ad_identifiers:
              - etcd
            init_config:
            instances:
              - prometheus_url: https://%%host%%:2379/metrics
                tls_ca_cert: /etc/etcd-certs/ca.crt
                tls_cert: /etc/etcd-certs/client.crt
                tls_private_key: /etc/etcd-certs/client.key
                service: etcd
            logs:
              - source: etcd
                service: etcd
          coredns.yaml: |-
            ad_identifiers:
              - coredns
            init_config:
            instances:
              - prometheus_url: http://%%host%%:9153/metrics
                service: coredns
                tags:
                  - dns-pod:%%host%%
            logs:
              - source: coredns
                service: coredns
          calico.yaml: |-
            ad_identifiers:
              - node
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:9091/metrics
                service: calico-felix
            logs:
              - source: calico
                service: calico-node
          calico-controllers.yaml: |-
            ad_identifiers:
              - kube-controllers
            logs:
              - source: calico
                service: calico-kube-controllers
      containers:
        agent:
          env:
            - name: DD_IGNORE_AUTOCONF
              value: "etcd coredns"
          volumeMounts:
            - name: etcd-ca
              mountPath: /etc/etcd-certs/ca.crt
              readOnly: true
            - name: etcd-client-cert
              mountPath: /etc/etcd-certs/client.crt
              readOnly: true
            - name: etcd-client-key
              mountPath: /etc/etcd-certs/client.key
              readOnly: true
      volumes:
        - name: etcd-ca
          hostPath:
            path: /etc/kubernetes/pki/etcd/ca.crt
            type: File
        - name: etcd-client-cert
          hostPath:
            path: /etc/kubernetes/pki/apiserver-etcd-client.crt
            type: File
        - name: etcd-client-key
          hostPath:
            path: /etc/kubernetes/pki/apiserver-etcd-client.key
            type: File
