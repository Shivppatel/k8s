mongodb:
  auth:
    existingSecret: mongodb-auth
  image:
    registry: registry-1.docker.io
    repository: bitnamilegacy/mongodb
    tag: "latest@sha256:b0652af9c8d07b4b0bec60cf352a7c04d5e769d0d6e30e93566792affa3c0f20"
    pullPolicy: IfNotPresent
  updateStrategy:
    type: Recreate
  podAnnotations:
    ad.datadoghq.com/mongodb.checks: |
      {
        "mongo": {
          "init_config": {},
          "instances": [
            {
              "hosts": [
                "%%host%%:27017"
              ],
              "username": "datadog",
              "password": "ENC[k8s_secret@mongodb/mongodb-datadog/password]",
              "database": "admin",
              "options": {
                "authSource": "admin"
              },
              "dbm": false,
              "database_autodiscovery": {
                "enabled": true
              }
            }
          ]
        }
      }
    ad.datadoghq.com/mongodb.logs: |
      [
        {
          "source": "mongodb",
          "service": "mongodb"
        }
      ]
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
