minio:
  mode: standalone
  statefulset:
    replicaCount: 1
  auth:
    existingSecret: "minio-root-credentials"
    rootUserSecretKey: "root-user"
    rootPasswordSecretKey: "root-password"
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: 2025.7.23-debian-12-r3
  # The data PVC is ReadWriteOnce; avoid a surge pod on another node failing
  # with a Multi-Attach error.
  updateStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  console:
    image:
      registry: docker.io
      repository: bitnamilegacy/minio-object-browser
      tag: 2.0.2-debian-12-r3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
