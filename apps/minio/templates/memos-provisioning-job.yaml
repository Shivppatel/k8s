apiVersion: batch/v1
kind: Job
metadata:
  name: memos-minio-provisioning
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos-minio-provisioning
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ .Values.memosStorage.clientImage | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              mkdir -p /tmp/mc
              cp /credentials/config.json /tmp/mc/config.json
              mc --config-dir /tmp/mc mb --ignore-existing homelab/{{ .Values.memosStorage.bucket }} >/dev/null
              mc --config-dir /tmp/mc anonymous set none homelab/{{ .Values.memosStorage.bucket }} >/dev/null
              mc --config-dir /tmp/mc admin policy create homelab {{ .Values.memosStorage.bucket }} /policy/policy.json >/dev/null
              if ! mc --config-dir /tmp/mc admin user add homelab </credentials/user-credentials >/dev/null 2>&1; then
                echo "Failed to provision the Memos MinIO user" >&2
                exit 1
              fi
              mc --config-dir /tmp/mc admin policy attach homelab {{ .Values.memosStorage.bucket }} --user {{ .Values.memosStorage.user }} >/dev/null
              echo "Memos private bucket and scoped MinIO user are ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: memos-minio-provisioning
            defaultMode: 0440
        - name: policy
          configMap:
            name: memos-bucket-policy
        - name: tmp
          emptyDir: {}
