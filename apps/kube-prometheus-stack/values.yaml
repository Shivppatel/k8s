kube-prometheus-stack:
  # Consumer readiness is required before this all-namespace pilot is activated.
  sherlockReceiver:
    # Scope profiles share one existing Alertmanager bearer; IDs stay stable per episode.
    enabled: true
    mirrorToExistingSlack: true
    routeTiming: {}
    url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-unbound-alerts
    matchers:
    - severity=~"critical|warning"
    - namespace!=""
    profiles:
    - name: sherlock-test
      url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-alerts
      matchers:
      - alertname="SherlockObservabilityIntegrationTest"
      - sherlock_probe="9fcacfa27f81f459e44376a6"
      - namespace="observability"
    - name: sherlock-node
      url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-node-alerts
      matchers:
      - job="kube-state-metrics"
      - alertname=~"KubeNode.+"
      - node!=""
    - name: sherlock-pod
      url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-pod-alerts
      matchers:
      - job="kube-state-metrics"
      - alertname=~"Kube(Pod|Container).+"
      - pod!=""
    - name: sherlock-workload
      url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-workload-alerts
      matchers:
      - job="kube-state-metrics"
      - alertname=~"Kube(Deployment|StatefulSet|DaemonSet).+"
    - name: sherlock-namespace
      url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-namespace-alerts
      matchers:
      - job="kube-state-metrics"
      - alertname=~"KubePdb.+"
    - name: sherlock-target
      url: http://sherlock.sherlock.svc.cluster.local:8080/webhooks/alertmanager/homelab-target-alerts
      matchers:
      - alertname="TargetDown"
      - service!=""
  # Disable monitoring for components that don't expose metrics
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  grafana:
    # Vault owns bootstrap credentials; never generate passwords during Argo renders.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    grafana.ini:
      server:
        root_url: https://grafana.shivpatel.xyz
      tracing.opentelemetry.otlp:
        address: "alloy.observability.svc.cluster.local:4317"
        insecure: true
      diagnostics.profiling:
        enabled: true
        addr: "0.0.0.0"
        port: 6060
      plugins:
        preinstall_async: false
        check_for_updates: false
        preinstall_disabled: true
    env:
      GF_DIAGNOSTICS_PROFILING_ENABLED: "true"
      GF_DIAGNOSTICS_PROFILING_ADDR: "0.0.0.0"
      GF_DIAGNOSTICS_PROFILING_PORT: "6060"
    podAnnotations:
      ad.datadoghq.com/grafana.checks: |
        {
          "grafana": {
            "init_config": {},
            "instances": [
              {
                "openmetrics_endpoint": "http://%%host%%:3000/metrics",
                "service": "grafana"
              }
            ]
          }
        }
      ad.datadoghq.com/grafana.logs: |
        [
          {
            "source": "grafana",
            "service": "grafana"
          }
        ]
      profiles.grafana.com/cpu.scrape: "true"
      profiles.grafana.com/cpu.port_name: "profiling"
      profiles.grafana.com/memory.scrape: "true"
      profiles.grafana.com/memory.port_name: "profiling"
      profiles.grafana.com/goroutine.scrape: "true"
      profiles.grafana.com/goroutine.port_name: "profiling"
    persistence:
      enabled: true
      type: sts
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      finalizers:
        - kubernetes.io/pvc-protection
    sidecar:
      datasources:
        name: Prometheus
        uid: prometheus
        exemplarTraceIdDestinations:
          datasourceUid: tempo
          traceIdLabelName: trace_id
          urlDisplayLabel: View trace
        alertmanager:
          enabled: true
          name: Alertmanager
          uid: alertmanager
          handleGrafanaManagedAlerts: false
          implementation: prometheus
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        editable: false
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: "1"
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo-distributed-query-frontend.tempo-distributed.svc.cluster.local:3200
        editable: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-15m"
            spanEndTimeShift: "15m"
            tags:
              - service.name
              - k8s.namespace.name
              - k8s.pod.name
              - deployment.environment
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{cluster="homelab"} |= "$${__trace.traceId}"'
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-15m"
            spanEndTimeShift: "15m"
            tags:
              - key: service.name
                value: service
              - key: deployment.environment
                value: environment
            queries:
              - name: Span rate
                query: sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
          tracesToProfiles:
            datasourceUid: pyroscope
            tags:
              - service.name
            profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.observability.svc.cluster.local:4040
        editable: false
        jsonData:
          minStep: 15s

  alertmanager:
    # Keep the existing Slack/inhibition config as the single source of truth.
    # The optional child groups by every label so webhook groups never truncate.
    tplConfig: true
    stringConfig: |-
      {{- $cfg := deepCopy .Values.alertmanager.config -}}
      {{- if .Values.sherlockReceiver.enabled -}}
      {{- $receiver := dict "name" "sherlock" "webhook_configs" (list (dict "url" .Values.sherlockReceiver.url "send_resolved" true "max_alerts" 16 "timeout" "10s" "http_config" (dict "authorization" (dict "type" "Bearer" "credentials_file" "/etc/alertmanager/sherlock-webhook/webhook_token")))) -}}
      {{- $_ := set $cfg "receivers" (append $cfg.receivers $receiver) -}}
      {{- $routes := $cfg.route.routes -}}
      {{- $route := dict "receiver" "sherlock" "matchers" .Values.sherlockReceiver.matchers "group_by" (list "...") "continue" .Values.sherlockReceiver.mirrorToExistingSlack -}}
      {{- range $key, $duration := .Values.sherlockReceiver.routeTiming -}}
      {{- if not (has $key (list "group_wait" "group_interval" "repeat_interval")) -}}{{- fail "Unsupported Sherlock route timing field" -}}{{- end -}}
      {{- $_ := set $route $key $duration -}}
      {{- end -}}
      {{- $profiles := .Values.sherlockReceiver.profiles | default list -}}
      {{- if gt (len $profiles) 12 -}}{{- fail "At most twelve Sherlock receiver profiles are supported" -}}{{- end -}}
      {{- if $profiles -}}
      {{- $origin := urlParse .Values.sherlockReceiver.url -}}
      {{- if or (not (has $origin.scheme (list "http" "https"))) $origin.userinfo $origin.query $origin.fragment (not (regexMatch "^/webhooks/alertmanager/[a-z0-9][a-z0-9-]{0,62}$" $origin.path)) -}}{{- fail "Sherlock profile parent URL must be a credential-free native intake URL" -}}{{- end -}}
      {{- $names := dict -}}
      {{- range $cfg.receivers -}}{{- $_ := set $names .name true -}}{{- end -}}
      {{- $children := list -}}
      {{- range $profile := $profiles -}}
      {{- if or (not (regexMatch "^sherlock-[a-z0-9-]{1,54}$" $profile.name)) (hasKey $names $profile.name) (not $profile.matchers) -}}{{- fail "Sherlock profiles need unique bounded names and explicit matchers" -}}{{- end -}}
      {{- $_ := set $names $profile.name true -}}
      {{- $target := urlParse $profile.url -}}
      {{- if or (ne $target.scheme $origin.scheme) (ne $target.host $origin.host) $target.userinfo $target.query $target.fragment (not (regexMatch "^/webhooks/alertmanager/[a-z0-9][a-z0-9-]{0,62}$" $target.path)) -}}{{- fail "Sherlock profile URLs must use the parent receiver origin and a native intake path" -}}{{- end -}}
      {{- $childReceiver := dict "name" $profile.name "webhook_configs" (list (dict "url" $profile.url "send_resolved" true "max_alerts" 16 "timeout" "10s" "http_config" (dict "authorization" (dict "type" "Bearer" "credentials_file" "/etc/alertmanager/sherlock-webhook/webhook_token")))) -}}
      {{- $_ := set $cfg "receivers" (append $cfg.receivers $childReceiver) -}}
      {{- $children = append $children (dict "receiver" $profile.name "matchers" $profile.matchers "continue" false) -}}
      {{- end -}}
      {{- $_ := set $route "routes" $children -}}
      {{- end -}}
      {{- $routes = append $routes $route -}}
      {{- if .Values.sherlockReceiver.mirrorToExistingSlack -}}
      {{- $routes = append $routes (dict "receiver" $cfg.route.receiver) -}}
      {{- end -}}
      {{- $_ := set $cfg.route "routes" $routes -}}
      {{- end -}}
      {{ $cfg | toYaml }}
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal:
            - namespace
            - alertname
        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal:
            - namespace
            - alertname
        - source_matchers:
            - 'alertname = InfoInhibitor'
          target_matchers:
            - 'severity = info'
          equal:
            - namespace
        - target_matchers:
            - 'alertname = InfoInhibitor'
      route:
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: slack-default
        routes:
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: "null"
        - name: slack-default
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/SLACK_WEBHOOK_URL
              send_resolved: true
              title: >-
                [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
              text: >-
                {{ range .Alerts }}
                *Namespace:* {{ .Labels.namespace | default "n/a" }}
                *Severity:* {{ .Labels.severity | default "unknown" }}
                *Summary:* {{ .Annotations.summary | default .Annotations.description | default .Labels.alertname }}
                *Description:* {{ .Annotations.description | default "n/a" }}

                {{ end }}
      templates:
        - /etc/alertmanager/config/*.tmpl
    alertmanagerSpec:
      # These conditional fields are rendered by the upstream chart's tpl hook.
      # Existing Slack secret mounts remain unchanged in either mode.
      additionalConfigString: |
        {{- if .Values.sherlockReceiver.enabled }}
        volumes:
          - name: sherlock-webhook
            secret:
              secretName: alertmanager-sherlock-webhook
              defaultMode: 288
        volumeMounts:
          - name: sherlock-webhook
            mountPath: /etc/alertmanager/sherlock-webhook
            readOnly: true
        {{- end }}
      retention: 120h
      secrets:
        - alertmanager-slack-webhook
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  crds:
    upgradeJob:
      enabled: true
      forceConflicts: true
      image:
        kubectl:
          tag: v1.34.1

  prometheus:
    prometheusSpec:
      podMetadata:
        annotations:
          profiles.grafana.com/cpu.scrape: "true"
          profiles.grafana.com/cpu.port_name: "http-web"
          profiles.grafana.com/memory.scrape: "true"
          profiles.grafana.com/memory.port_name: "http-web"
          profiles.grafana.com/goroutine.scrape: "true"
          profiles.grafana.com/goroutine.port_name: "http-web"
      enableFeatures:
        - exemplar-storage
      enableRemoteWriteReceiver: true
      externalLabels:
        cluster: homelab
        environment: homelab
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 8Gi
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      # Allow Prometheus to discover ServiceMonitors from all namespaces
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      podMonitorSelector: {}
