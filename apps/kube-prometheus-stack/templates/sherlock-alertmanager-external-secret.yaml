{{- if (index .Values "kube-prometheus-stack").sherlockReceiver.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-sherlock-webhook
  namespace: observability
spec:
  refreshInterval: "5m"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: alertmanager-sherlock-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_token
      remoteRef: {key: secret/data/Agents/sherlock/observability, property: alertmanager_webhook_token}
{{- end }}
