apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: {{ .Release.Namespace }}
  annotations:
    secret.reloader.stakater.com/reload: "memos-db-secret,memos-storage-secret"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-minio
          image: {{ .Values.minioClient.image | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /tmp/mc
              cp /credentials/config.json /tmp/mc/config.json
              for attempt in $(seq 1 60); do
                if mc --config-dir /tmp/mc stat memos/{{ .Values.storage.bucket }} >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "Memos attachment bucket is not ready" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: storage-credentials
              mountPath: /credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: memos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MEMOS_DRIVER
              value: postgres
            - name: MEMOS_DSN_FILE
              value: /database/dsn
            - name: MEMOS_DATA
              value: /var/opt/memos
            - name: MEMOS_PORT
              value: {{ .Values.service.port | quote }}
            - name: MEMOS_INSTANCE_URL
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            - name: MEMOS_LOG_LEVEL
              value: info
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: database-credentials
              mountPath: /database
              readOnly: true
            - name: configuration
              mountPath: /etc/secrets
              readOnly: true
            - name: data
              mountPath: /var/opt/memos
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-credentials
          secret:
            secretName: memos-db-secret
            defaultMode: 0440
        - name: storage-credentials
          secret:
            secretName: memos-storage-secret
            defaultMode: 0440
            items:
              - key: config.json
                path: config.json
        - name: configuration
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: memos-config
              - secret:
                  name: memos-storage-secret
                  items:
                    - key: memos-instance-setting-storage.json
                      path: memos-instance-setting-storage.json
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
