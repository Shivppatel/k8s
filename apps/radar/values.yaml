radar:
  fullnameOverride: radar
  replicaCount: 1

  service:
    type: ClusterIP
    port: 9280

  # Exposure uses the repository's custom Traefik IngressRoute.
  ingress:
    enabled: false
  httpRoute:
    enabled: false

  # Authentication is enforced upstream by Cloudflare, not by Radar.
  auth:
    mode: none
  # Custom IngressRoute hosts are not auto-added by the upstream chart.
  allowedHosts:
    - radar.shivpatel.xyz
  rbac:
    create: true
    helm: false
    secrets: true
    podExec: false
    podLogs: true
    portForward: false
    selfUpgrade: false
    traffic: false
    viewRBAC: true
    viewWebhooks: true
    viewNodeRuntime: true
    # Full API read visibility, including every installed/future CRD.
    crdGroups:
      all: true
    additionalRules:
      - nonResourceURLs: ["*"]
        verbs: ["get"]

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 200m
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi

  # Budget for full SBOM caches plus concurrent dashboard/topology copies.
  env:
    - name: GOMEMLIMIT
      value: "4GiB"
    # MCP serves read-only tools only (no restart, scale, apply, drain or Helm).
    - name: RADAR_MCP_READ_ONLY
      value: "1"

  timeline:
    storage: sqlite
    retention: 168h
    maxSize: 800Mi
  persistence:
    enabled: true
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    # SQLite VACUUM needs free space about equal to the database, so the
    # volume must hold timeline.maxSize (800Mi) twice. At 1Gi it filled to
    # 98% for ~10h on 2026-10-23/24 when cleanup could not complete.
    size: 2Gi

  traffic:
    prometheusUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

  usageReporting:
    enabled: false
  cloud:
    enabled: false
  # Read-only MCP for AI agents. Not routed publicly (see radar-ingress.yaml);
  # reach it with kubectl port-forward. exec_pod stays off.
  mcp:
    enabled: true
    execTools: false
  # Read-only Argo CD account token from Vault via ExternalSecret
  # radar-argocd. argocd-server runs with server.insecure (TLS ends at
  # Traefik), so auto-discovery's HTTPS probe fails; pin in-cluster HTTP.
  argocd:
    existingSecret: radar-argocd
    existingSecretKey: token
    url: http://argocd-server.argocd.svc.cluster.local
