# Read-only Argo CD API token for Radar's GitOps view (account radar,
# role:readonly in apps/argocd). The owner writes it to Vault secret/radar,
# field argocd_token; tf/vault/locals.tf grants External Secrets the read.
# Wave -1 so the Secret exists before the Deployment that references it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: radar-argocd
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: secret/data/radar, property: argocd_token}
