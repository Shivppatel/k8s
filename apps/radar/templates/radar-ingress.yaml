apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radar-ingress
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    # The MCP endpoints (/mcp, /mcp-readonly) are not published; agents use port-forward.
    - match: Host(`radar.shivpatel.xyz`) && !PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: radar
          port: 9280
  tls: {}
