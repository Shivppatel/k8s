generic-device-plugin:
  fullnameOverride: gpu-device-plugin
  image:
    repository: squat/generic-device-plugin
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    automount: false
  devices:
    - name: dri
      groups:
        - paths:
            - path: /dev/dri/renderD128
  hostPathMounts:
    - name: dri
      hostPath: /dev/dri
      type: Directory
      readOnly: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: null
      memory: 64Mi
  deployPodMonitor: true
