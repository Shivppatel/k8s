traefik:
  ingressRoute:
    dashboard:
      enabled: true

  log:
    level: "INFO" # DEBUG if needed
    format: json

  accessLog:
    enabled: true
    format: json
    addInternals: false
    fields:
      headers:
        defaultMode: drop

  service:
    spec:
      type: LoadBalancer
      loadBalancerIP: "192.168.20.20"
    additionalServices:
      jellyfin:
        spec:
          type: LoadBalancer
          loadBalancerIP: "192.168.20.21"
          externalTrafficPolicy: Local

  ports:
    # Keep implicit routers on the existing internal entrypoints.
    web:
      asDefault: true
    websecure:
      asDefault: true
    jellyfin-public:
      port: 8444
      exposedPort: 443
      protocol: TCP
      expose:
        default: false
        jellyfin: true
      http:
        middlewares:
          - traefik-security-headers@kubernetescrd
        tls:
          enabled: true

  additionalArguments:
    - --entryPoints.web.http.redirections.entryPoint.to=websecure
    - --entryPoints.web.http.redirections.entryPoint.scheme=https
    - --entryPoints.web.http.redirections.entryPoint.permanent=true
    - --entryPoints.websecure.http.middlewares=traefik-security-headers@kubernetescrd
    # Accept forwarded client headers only from Cloudflared pod IPAM blocks.
    - --entryPoints.web.forwardedHeaders.trustedIPs=10.244.0.0/26,10.244.1.0/26,10.244.2.0/26,10.244.104.0/26,10.244.135.128/26,10.244.166.128/26
    - --entryPoints.websecure.forwardedHeaders.trustedIPs=10.244.0.0/26,10.244.1.0/26,10.244.2.0/26,10.244.104.0/26,10.244.135.128/26,10.244.166.128/26
    - --tracing.addinternals=true
    - --tracing.otlp=true
    - --tracing.otlp.grpc=true
    - --tracing.otlp.grpc.endpoint=alloy.observability.svc.cluster.local:4317
    - --tracing.otlp.grpc.insecure=true
    - --api.debug=true
    - --api.insecure=true

  tlsStore:
    default:
      defaultCertificate:
        secretName: wildcard-cert-new

  persistence:
    enabled: false

  deployment:
    replicas: 3
    podAnnotations:
      profiles.grafana.com/cpu.scrape: "true"
      profiles.grafana.com/cpu.port_name: "traefik"
      profiles.grafana.com/memory.scrape: "true"
      profiles.grafana.com/memory.port_name: "traefik"
      profiles.grafana.com/goroutine.scrape: "true"
      profiles.grafana.com/goroutine.port_name: "traefik"

  metrics:
    addInternals: true
    prometheus:
      addRoutersLabels: true
      addServicesLabels: true
      serviceMonitor:
        enabled: true
        honorLabels: true
