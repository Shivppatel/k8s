sherlock:
  config:
    version: sherlock/v1alpha1
    installation: homelab
    listen: 0.0.0.0:8080
    dashboard_url: https://sherlock.shivpatel.xyz
    feedback:
      enabled: true
      issuer: https://shivppatel.cloudflareaccess.com
      audience: e2f0a6566722fc9026e207a8337c488124d9e2520c43eaa34e45c2ee594c74b8
      allowed_emails:
        file: /run/feedback/allowed_emails
      comments_enabled: false
    database:
      file: /run/database/database_url
    datadog:
    - id: us5
      enabled: true
      site: us5.datadoghq.com
      webhook_token:
        file: /run/source/webhook_token
      api_key:
        file: /run/source/datadog_api_key
      application_key:
        file: /run/source/datadog_app_key
      notebook_ids: []
    # Each integration is independent. Disable one without removing its mapping.
    alertmanager:
    - id: homelab-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
    - id: homelab-pod-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
      label_mapping:
        kube_namespace: namespace
        pod_name: pod
        kube_cluster_name: cluster
    - id: homelab-workload-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
      label_mapping:
        kube_namespace: namespace
        kube_deployment: deployment
        kube_stateful_set: statefulset
        kube_daemon_set: daemonset
        kube_cluster_name: cluster
    - id: homelab-namespace-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
      label_mapping:
        kube_namespace: namespace
        kube_cluster_name: cluster
    - id: homelab-node-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
      label_mapping:
        host: node
        kube_cluster_name: cluster
    - id: homelab-target-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
      label_mapping:
        kube_namespace: namespace
        kube_service: service
        kube_cluster_name: cluster
    - id: homelab-unbound-alerts
      enabled: true
      webhook_token: {file: /run/observability/alertmanager_webhook_token}
      repeat_policy: same_incident
      datadog_evidence_connections: [us5]
      label_mapping:
        kube_cluster_name: cluster
    prometheus:
    - id: homelab-metrics
      enabled: true
      url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      allow_plaintext: true
      allowed_cidrs: [10.100.152.57/32]
      query_templates:
      - 'sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace={{namespace}}}[5m]))'
      - 'max_over_time(kube_pod_status_ready{namespace={{namespace}},condition="false"}[5m])'
      - 'sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace={{namespace}},pod={{pod}},container!=""}[5m]))'
    loki:
    - id: homelab-logs
      enabled: true
      url: http://loki-gateway.observability.svc.cluster.local
      allow_plaintext: true
      allowed_cidrs: [10.111.210.174/32]
      tenant_id: '1'
      query_templates:
      - '{namespace={{namespace}}}'
      - '{namespace={{namespace}},pod={{pod}}}'
    tempo:
    - id: homelab-traces
      enabled: true
      url: http://tempo-distributed-query-frontend.tempo-distributed.svc.cluster.local:3200
      allow_plaintext: true
      allowed_cidrs: [10.97.216.10/32]
      query_templates:
      - '{ resource.k8s.namespace.name = {{namespace}} }'
    grafana:
    - id: homelab-dashboards
      enabled: true
      url: http://kube-prometheus-stack-grafana.observability.svc.cluster.local
      external_url: https://grafana.shivpatel.xyz
      allow_plaintext: true
      allowed_cidrs: [10.108.123.115/32]
      bearer_token: {file: /run/observability/grafana_token}
      dashboard_uids: [homelab-observability]
    pyroscope:
    - id: homelab-profiles
      enabled: true
      url: http://pyroscope.observability.svc.cluster.local:4040
      allow_plaintext: true
      allowed_cidrs: [10.106.140.45/32]
      query_templates:
      - 'process_cpu:cpu:nanoseconds:cpu:nanoseconds{namespace={{namespace}}}'
      - 'memory:inuse_space:bytes:space:bytes{namespace={{namespace}}}'
    slack:
      enabled: true
      mode: incoming_webhook
      channel: C0C95F0RPB2
      webhook_url:
        file: /run/source/slack_webhook_url
    kubernetes:
      id: homelab
      server: https://kubernetes.default.svc
      ca_certificate:
        file: /run/kubernetes/ca.crt
      token:
        file: /run/kubernetes/token
    github:
      id: homelab
      app_id: '5268741'
      installation_id: 170114481
      private_key:
        file: /run/source/github_private_key
      repositories:
        Shivppatel/k8s: 1075053423
        Shivppatel/k8s-private: 1179592605
      content_prefixes:
        Shivppatel/k8s:
        - apps
        Shivppatel/k8s-private:
        - apps
      source_files:
        Shivppatel/k8s:
        - apps/argocd/Chart.yaml
    runtime:
      enabled: true
      endpoint: http://sherlock-runtime:8090
      token:
        file: /run/runtime/runtime_token
      # One model selector; runtime-configmap uses this same value.
      model: gpt-6.1-sol
    discovery:
      enabled: true
      datadog_connections:
      - us5
      alertmanager_connections:
      - homelab-alerts
      - homelab-pod-alerts
      - homelab-workload-alerts
      - homelab-namespace-alerts
      - homelab-node-alerts
      - homelab-target-alerts
      - homelab-unbound-alerts
      argo_namespace: argocd
      interval_seconds: 300
      max_age_seconds: 600
      max_resources: 1000
    mappings:
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodCrashLooping
      scope_tags: [kube_namespace:kafka, pod_name:kafka-controller-0]
      application_namespace: argocd
      application: kafka
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodNotReady
      scope_tags: [kube_namespace:kafka, pod_name:kafka-controller-0]
      application_namespace: argocd
      application: kafka
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodCrashLooping
      scope_tags: [kube_namespace:kafka, pod_name:kafka-controller-1]
      application_namespace: argocd
      application: kafka
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodNotReady
      scope_tags: [kube_namespace:kafka, pod_name:kafka-controller-1]
      application_namespace: argocd
      application: kafka
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodCrashLooping
      scope_tags: [kube_namespace:kafka, pod_name:kafka-controller-2]
      application_namespace: argocd
      application: kafka
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodNotReady
      scope_tags: [kube_namespace:kafka, pod_name:kafka-controller-2]
      application_namespace: argocd
      application: kafka
    - alertmanager_connection: homelab-pod-alerts
      alert_name: KubePodNotReady
      scope_tags: [kube_namespace:trivy-system, pod_name:trivy-trivy-operator-6d45f4f9f-b6zch]
      application_namespace: argocd
      application: trivy
    model_budget:
      daily_attempt_limit: 50
      time_zone: America/New_York
    repeated_alerts: separate_incident
    recovery: all_in_episode
  runtime:
    version: sherlock/runtime/v1alpha1
    deadline_seconds: 120
    max_concurrent: 1
    max_input_bytes: 100000
app-template:
  global:
    createDefaultServiceAccount: false
  serviceAccount:
    app:
      forceRename: sherlock
      automountServiceAccountToken: false
    runtime:
      forceRename: sherlock-runtime
      automountServiceAccountToken: false
    egress:
      forceRename: sherlock-egress
      automountServiceAccountToken: false
    identity-probe:
      forceRename: sherlock-identity-probe
      automountServiceAccountToken: false
  controllers:
    main:
      replicas: 1
      strategy: Recreate
      serviceAccount:
        identifier: app
      pod:
        labels:
          sherlock-role: app
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      annotations:
        secret.reloader.stakater.com/reload: sherlock-source-secret,sherlock-db-secret,sherlock-runtime-secret,sherlock-feedback-secret,sherlock-observability-secret
        configmap.reloader.stakater.com/reload: sherlock-config
      containers:
        main:
          image:
            repository: ghcr.io/shivppatel/sherlock
            tag: sha-65fbaf3e207ca73723c96dc33b5ec5491a344417@sha256:413d37e638ca670a3cbbfcdf47a1a8bc4652da8a60fcdd8f449d5c794cf94904
          args:
          - -config
          - /config/config.yaml
          securityContext: &id001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
                failureThreshold: 60
                periodSeconds: 5
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /readyz
                  port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      forceRename: sherlock
    runtime:
      enabled: true
      replicas: 1
      strategy: Recreate
      serviceAccount:
        identifier: runtime
      pod:
        labels:
          sherlock-role: runtime
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      annotations:
        secret.reloader.stakater.com/reload: sherlock-runtime-secret
        configmap.reloader.stakater.com/reload: sherlock-runtime-config
      containers:
        main:
          image:
            repository: ghcr.io/shivppatel/sherlock-runtime
            tag: sha-2be4bbc442fa91c464fe7c6598a8e84cb2a45a70@sha256:ae07d0ccb0ecaec0265a0388d70f3d72635abafd99b3c8fae89458c031239ed8
          env:
            HTTPS_PROXY: http://egress:3128
          securityContext: *id001
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8090
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
      forceRename: sherlock-runtime
    egress:
      enabled: true
      replicas: 1
      strategy: Recreate
      serviceAccount:
        identifier: egress
      pod:
        labels:
          sherlock-role: egress
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/shivppatel/sherlock-egress
            tag: sha-36b8433988345b04c57cf54f56f65a0f641338c3@sha256:ff5e4f3c599d4ceba6383ac0be79e16f3493e121878fda175a29ef7b0ad542c1
          securityContext: *id001
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 3128
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 3128
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
      forceRename: sherlock-egress
    identity-probe: &identity-probe-controller
      type: job
      forceRename: sherlock-identity-probe
      job:
        activeDeadlineSeconds: 2700
        backoffLimit: 0
      serviceAccount:
        identifier: identity-probe
      pod:
        labels:
          sherlock-role: identity-probe
        automountServiceAccountToken: false
        restartPolicy: Never
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      containers:
        observer: &identity-probe-observer
          image:
            repository: ghcr.io/shivppatel/sherlock-identity-probe
