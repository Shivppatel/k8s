          args:
          - -listen
          - 0.0.0.0:8091
          - -monitor-id
          - "23061575"
          - -token-file
          - /run/probe/token
          - -max-receipts
          - "32"
          - -deadline
          - 44m
          - -reject-first
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet: {path: /healthz, port: 8091}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
    identity-probe-rerun:
      <<: *identity-probe-controller
      forceRename: sherlock-identity-probe-20261013
    identity-probe-contenttype-rerun:
      <<: *identity-probe-controller
      forceRename: sherlock-identity-probe-20261013-json
      containers:
        observer:
          <<: *identity-probe-observer
          image:
            repository: ghcr.io/shivppatel/sherlock-identity-probe
            tag: sha-903b491a17fc1aa97af7d2f75f7bb6b7791f5c9a@sha256:18cdeeb6d9dabf1d0d22adc5cf3cd5cf7e2d4809cb53cf23be6121838c7aded0
    identity-probe-contenttype-retry:
      <<: *identity-probe-controller
      forceRename: sherlock-identity-probe-20261013-json-retry
      containers:
        observer:
          <<: *identity-probe-observer
          image:
            repository: ghcr.io/shivppatel/sherlock-identity-probe
            tag: sha-903b491a17fc1aa97af7d2f75f7bb6b7791f5c9a@sha256:18cdeeb6d9dabf1d0d22adc5cf3cd5cf7e2d4809cb53cf23be6121838c7aded0
  service:
    main:
      forceRename: sherlock
      controller: main
      ports:
        http:
          port: 8080
    runtime:
      enabled: true
      forceRename: sherlock-runtime
      controller: runtime
      ports:
        http:
          port: 8090
    egress:
      enabled: true
      forceRename: egress
      controller: egress
      ports:
        proxy:
          port: 3128
    identity-probe:
      forceRename: sherlock-identity-probe
      controller: identity-probe-contenttype-retry
      ports:
        http:
          port: 8091
  persistence:
    observability:
      # Optional projection permits all integrations to be disabled independently.
      type: projected
      defaultMode: 288
      sources:
      - secret:
          name: sherlock-observability-secret
          optional: true
      advancedMounts:
        main:
          main:
          - path: /run/observability
            readOnly: true
    feedback:
      type: secret
      name: sherlock-feedback-secret
      defaultMode: 288
      items:
      - key: allowed_emails
        path: allowed_emails
      advancedMounts:
        main:
          main:
          - path: /run/feedback
            readOnly: true
    configuration:
      type: configMap
      name: sherlock-config
      defaultMode: 288
      advancedMounts:
        main:
          main:
          - path: /config
            readOnly: true
    source:
      type: secret
      name: sherlock-source-secret
      defaultMode: 288
      advancedMounts:
        main:
          main:
          - path: /run/source
            readOnly: true
    database:
      type: secret
      name: sherlock-db-secret
      defaultMode: 288
      advancedMounts:
        main:
          main:
          - path: /run/database
            readOnly: true
    projected-reader:
      enabled: true
      type: projected
      defaultMode: 288
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
      - configMap:
          name: kube-root-ca.crt
          items:
          - key: ca.crt
            path: ca.crt
      advancedMounts:
        main:
          main:
          - path: /run/kubernetes
            readOnly: true
    runtime-api-for-app:
      enabled: true
      type: secret
      name: sherlock-runtime-secret
      defaultMode: 288
      items:
      - key: runtime_token
        path: runtime_token
      advancedMounts:
        main:
          main:
          - path: /run/runtime
            readOnly: true
    runtime-configuration:
      enabled: true
      type: configMap
      name: sherlock-runtime-config
      defaultMode: 288
      advancedMounts:
        runtime:
          main:
          - path: /config
            readOnly: true
    runtime-api:
      enabled: true
      type: secret
      name: sherlock-runtime-secret
      defaultMode: 288
      items:
      - key: runtime_token
        path: runtime_token
      advancedMounts:
        runtime:
          main:
          - path: /run/secrets
            readOnly: true
    auth:
      enabled: true
      type: persistentVolumeClaim
      forceRename: sherlock-codex-auth
      accessMode: ReadWriteOnce
      size: 1Gi
      retain: true
      advancedMounts:
        runtime:
          main:
          - path: /auth
      storageClass: longhorn
    evidence:
      enabled: true
      type: emptyDir
      medium: Memory
      sizeLimit: 16Mi
      advancedMounts:
        runtime:
          main:
          - path: /evidence
    runtime-tmp:
      enabled: true
      type: emptyDir
      medium: Memory
      sizeLimit: 16Mi
      advancedMounts:
        runtime:
          main:
          - path: /tmp
    identity-probe-token:
      type: secret
      name: sherlock-identity-probe-token
      defaultMode: 288
      advancedMounts:
        identity-probe:
          observer:
          - path: /run/probe
            readOnly: true
        identity-probe-rerun:
          observer:
          - path: /run/probe
            readOnly: true
        identity-probe-contenttype-rerun:
          observer:
          - path: /run/probe
            readOnly: true
        identity-probe-contenttype-retry:
          observer:
          - path: /run/probe
            readOnly: true
  defaultPodOptions:
    imagePullSecrets:
    - name: sherlock-registry-secret
