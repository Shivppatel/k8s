{{- $config := deepCopy .Values.sherlock.config -}}
{{- $_ := set $config.runtime "prompt_profile" (include "sherlock.ai.profile" .) -}}
{{- with .Values.storageAlertMappings }}
{{- $mappings := $config.mappings | default list }}
{{- range $namespace, $application := .applications }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" $namespace) }}{{ fail "storage alert namespace invalid" }}{{ end }}
{{- range $alert := $.Values.storageAlertMappings.alertNames }}
{{- $mappings = append $mappings (dict "alertmanager_connection" $.Values.storageAlertMappings.connection "alert_name" $alert "scope_tags" (list (printf "kube_namespace:%s" $namespace)) "application_namespace" "argocd" "application" $application "prometheus_query_profiles" $.Values.storageAlertMappings.prometheusProfile) }}
{{- end }}
{{- end }}
{{- $_ := set $config "mappings" $mappings }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sherlock-config
data:
  config.yaml: |
{{ $config | toYaml | indent 4 }}
