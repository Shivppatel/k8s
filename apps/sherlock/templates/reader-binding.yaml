# Reuse the previously approved GET/LIST ClusterRole; no new resource scopes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sherlock-incluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sherlock-reader
subjects:
  - kind: ServiceAccount
    name: sherlock
    namespace: {{ .Release.Namespace }}
