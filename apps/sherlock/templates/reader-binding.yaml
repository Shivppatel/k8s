# Reuse the approved read-only ClusterRole (apps/argocd/templates/sherlock-reader.yaml);
# its only addition since approval is a named GET on HPAs for KubeHpa* evidence.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sherlock-incluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sherlock-reader
subjects:
  - kind: ServiceAccount
    name: sherlock
    namespace: {{ .Release.Namespace }}
