apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-source-secret
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: sherlock-source-secret
    creationPolicy: Owner
  data:
    - secretKey: datadog_api_key
      remoteRef: {key: secret/data/Agents/sherlock, property: datadog-api-key}
    - secretKey: datadog_app_key
      remoteRef: {key: secret/data/Agents/sherlock, property: datadog-app-token}
    - secretKey: slack_webhook_url
      remoteRef: {key: secret/data/Agents/sherlock, property: slack}
    - secretKey: github_private_key
      remoteRef: {key: secret/data/Agents/sherlock/github, property: private_key}
    - secretKey: webhook_token
      remoteRef: {key: secret/data/Agents/sherlock/webhook, property: token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-runtime-secret
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: sherlock-runtime-secret
    creationPolicy: Owner
  data:
    - secretKey: runtime_token
      remoteRef: {key: secret/data/Agents/sherlock/runtime, property: api_token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-db-secret
spec:
  refreshInterval: "5m"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: sherlock-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        database_url: 'postgresql://{{ `{{ .username | urlquery }}` }}:{{ `{{ .password | urlquery }}` }}@postgresql-rw.postgresql.svc.cluster.local:5432/sherlock?sslmode=verify-full&sslrootcert=/run/database/database_ca.crt'
        database_ca.crt: '{{ `{{ .ca_certificate }}` }}'
  data:
    - secretKey: username
      remoteRef: {key: secret/data/Agents/sherlock/database, property: username}
    - secretKey: password
      remoteRef: {key: secret/data/Agents/sherlock/database, property: password}
    - secretKey: ca_certificate
      remoteRef: {key: secret/data/Agents/sherlock/database-ca, property: ca_certificate}

---
# Kubelet-only package reader: never mounted into any Sherlock container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-registry-secret
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: sherlock-registry-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ `{{ dict "auths" (dict "ghcr.io" (dict "username" .registry_username "password" .registry_token "auth" (printf "%s:%s" .registry_username .registry_token | b64enc))) | toJson }}` }}
  data:
    - secretKey: registry_username
      remoteRef: {key: secret/data/Agents/sherlock, property: registry_username}
    - secretKey: registry_token
      remoteRef: {key: secret/data/Agents/sherlock, property: registry_token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-feedback-secret
spec:
  refreshInterval: "5m"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: sherlock-feedback-secret
    creationPolicy: Owner
  data:
    - secretKey: allowed_emails
      remoteRef: {key: secret/data/Agents/sherlock/feedback, property: allowed_emails}
