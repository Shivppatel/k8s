{{- $grafana := false -}}
{{- $alerts := false -}}
{{- range .Values.sherlock.config.grafana -}}
{{- if .enabled -}}{{- $grafana = true -}}{{- end -}}
{{- end -}}
{{- range .Values.sherlock.config.alertmanager -}}
{{- if .enabled -}}{{- $alerts = true -}}{{- end -}}
{{- end -}}
{{- if or $grafana $alerts }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-observability-secret
spec:
  refreshInterval: "5m"
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: sherlock-observability-secret
    creationPolicy: Owner
  data:
    {{- if $grafana }}
    - secretKey: grafana_token
      remoteRef: {key: secret/data/Agents/sherlock/observability, property: grafana_token}
    {{- end }}
    {{- if $alerts }}
    - secretKey: alertmanager_webhook_token
      remoteRef: {key: secret/data/Agents/sherlock/observability, property: alertmanager_webhook_token}
    {{- end }}
{{- end }}
