{{- if not .Values.networkPolicy.enabled }}
{{- fail "identity probe requires networkPolicy.enabled" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sherlock-identity-probe-token
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: sherlock-identity-probe-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: secret/data/Agents/sherlock/webhook, property: identity_probe_token}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sherlock-identity-probe}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: "{{ .Release.Name }}", sherlock-role: identity-probe}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: "{{ .Values.networkPolicy.ingressNamespace }}"}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8091}]
  egress: []
{{- if .Values.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: sherlock-identity-probe-rate}
spec:
  rateLimit: {average: 2, burst: 4}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: sherlock-identity-probe-path}
spec:
  replacePath: {path: /capture}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: sherlock-identity-probe}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && Method(`POST`) && Path(`/identity/datadog`)
      kind: Rule
      middlewares:
        - {name: sherlock-identity-probe-rate}
        - {name: sherlock-body-limit}
        - {name: sherlock-headers}
        - {name: sherlock-identity-probe-path}
      services: [{name: sherlock-identity-probe, port: 8091}]
  tls: {}
{{- end }}
