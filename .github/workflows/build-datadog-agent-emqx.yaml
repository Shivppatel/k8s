name: Build Datadog Agent Integrations

on:
  push:
    paths:
      - ".github/workflows/build-datadog-agent-emqx.yaml"
      - "apps/datadog/Dockerfile.emqx"
      - "tests/check_datadog_image.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-datadog-agent-emqx.yaml"
      - "apps/datadog/Dockerfile.emqx"
      - "tests/check_datadog_image.py"
  workflow_dispatch:

env:
  AGENT_IMAGE: "ghcr.io/shivppatel/datadog-agent-emqx:7.74.0-jmx-emqx-1.1.0-grafana-1.0.0-nextcloud-2.0.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/datadog/Dockerfile.emqx
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.AGENT_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify integrations and PostgreSQL 18 compatibility
        run: python3 tests/check_datadog_image.py "$AGENT_IMAGE"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested Agent image
        if: github.event_name != 'pull_request'
        run: docker push "$AGENT_IMAGE"
